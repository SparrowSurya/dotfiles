# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
# Leader key
set -g prefix C-a

# Refresh config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Mouse support
set -g mouse on

# Enable mouse control (clickable windows, panes, resizable panes, scrolling)
set -g mouse on

# Turn off tmux handling clipboard natively if you want to use custom pipes
# set -g set-clipboard off

# Copy selection on mouse drag end without clearing selection or scrolling down
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

# Window & Pane indexing starting at 1
set -g base-index 1
setw -g pane-base-index 1

# Status bar position
set-option -g status-position top

# Default shell logic
if-shell "[[ $SHELL =~ bash$ ]]" {
	set-option -g default-command "/bin/bash"
} {
	set-option -g default-command "/bin/zsh"
}

# -----------------------------------------------------------------------------
# Terminal & True Color (Neovim support)
# -----------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set-option -sg escape-time 10
set-option -g focus-events on
set-option -a terminal-features "$TERM:RGB"

# Enable automatic window renaming so #W updates dynamically with running process
set -g allow-rename on
set -g automatic-rename on

# Personal key bindings
bind-key C-h split-window -h
bind-key C-S-h split-window -v

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------------------------------------------------------
# Catppuccin Theme Configuration (Must be defined BEFORE running catppuccin.tmux)
# -----------------------------------------------------------------------------
set -g @catppuccin_flavor "mocha"

# Date/Time module formatting (e.g., 03:00 PM)
set -g @catppuccin_date_time_text " %I:%M %p"

# Window styling options (Forces #W process name across active and inactive tabs)
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W"

# Menu styling options
set -g @catppuccin_menu_selected_style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# Pane styling options
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "#{?pane_in_mode,fg=#{@thm_lavender},#{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"

# Status line options
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
set -g @plugin "catppuccin/tmux#v2.3.0"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin "tmux-plugins/tpm"

# Run theme script directly
run-shell "sh ~/.tmux/plugins/tmux/catppuccin.tmux"

# -----------------------------------------------------------------------------
# Status Bar Layout Configuration
# -----------------------------------------------------------------------------
set -g status-right-length 150
set -g status-left-length 100

# Session Name on LHS with rounded right edge () and spacing
set -g status-left "#{E:@catppuccin_status_session}#[fg=#{@thm_surface_0},bg=default] "

# Catppuccin Status Modules on RHS (CPU followed by RAM with compact \ue266 icon)
set -g status-right "#{E:@catppuccin_status_application}"
# set -agF status-right "#{E:@catppuccin_status_cpu}"

# RAM module inserted right after CPU using compact microchip icon
# set -ag status-right "#[fg=#{@thm_sky},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{@thm_sky}]\ue266 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{ram_percentage} "

# set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Initialize TPM (Keep at bottom)
run "~/.tmux/plugins/tpm/tpm"
